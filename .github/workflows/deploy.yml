name: Deploy to Production

on:
  push:
    branches:
      - main

jobs:
  deploy:
    name: Deploy to Hostinger
    runs-on: ubuntu-latest
    if: github.repository == 'Aradhy20/sanmati-journal' && github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup SSH Key
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.PROD_SSH_KEY }}

      - name: Add server to known hosts
        run: ssh-keyscan -H ${{ secrets.PROD_SERVER_IP }} >> ~/.ssh/known_hosts

      - name: Rsync repository to production
        # Built assets (public_html/build/, bootstrap/ssr/) are committed — no npm build needed here.
        # Excludes: .env (server keeps its own), user storage, logs, build cache, node_modules, vendor.
        run: |
          rsync -azP --delete \
            --exclude='.env' \
            --exclude='sanmati-core/storage/app/private/' \
            --exclude='sanmati-core/storage/logs/' \
            --exclude='sanmati-core/bootstrap/cache/' \
            --exclude='sanmati-core/node_modules/' \
            --exclude='sanmati-core/vendor/' \
            --exclude='.git/' \
            ./ ${{ secrets.PROD_USER }}@${{ secrets.PROD_SERVER_IP }}:${{ secrets.PROD_PATH }}/

      - name: Run post-deploy commands on production
        run: |
          ssh ${{ secrets.PROD_USER }}@${{ secrets.PROD_SERVER_IP }} "
            cd ${{ secrets.PROD_PATH }}/sanmati-core &&
            php artisan migrate --force &&
            php artisan optimize:clear &&
            php artisan config:cache &&
            php artisan route:cache &&
            php artisan view:cache &&
            echo 'Deploy complete'
          "
